# light_v2 (WS8b phase 2): a lights-only fine-tune of note_v1 with the v2 light prompt.
#   bsmapper lights styles data/processed_v1     (once: writes light_styles.json)
#   bsmapper train configs/light_v2.yaml         (resumes from run.out_dir/last.pt)
# The model is note_v1's (same sizes), except the light vocabulary grows from 500 to 532
# tokens (LSTYLE, LEVEL, PAL, FLIPS, REF, REF_END; new rows start at the mean embedding).
# The audio encoder and the note decoder are frozen, so the checkpoint generates exactly
# note_v1's notes; the note memory and the lighting decoder train. See docs/LIGHTING_V2.md
# ("Phase 2").
model:
  d_model: 512
  n_heads: 8
  ff_mult: 4
  dropout: 0.1
  encoder_layers: 6
  decoder_layers: 10
  max_len: 1536
  light_layers: 6
  light_max_len: 1536
  note_memory_layers: 2
  note_memory_len: 512
  grad_checkpointing: false
  qk_norm: true
data:
  root: data/processed_v1
  context_events: 16
  max_note_tokens: 1024
  max_light_tokens: 1536    # light prompt + reference (<= 384) + tail + body
  max_light_body: 1024      # longer bodies are lightID spam
  note_memory_tokens: 512
  ref_threshold: 0.85
  lights_gold_only: true
  light_styles: light_styles.json
  light_labelled_only: true # leaves out lightID / strobe sequences and sparse shows
  light_style_dropout: 0.2
  scene_dropout: 0.2
  light_ref_dropout: 0.3
  max_light_ref_tokens: 384
  empty_window_weight: 0.25
  num_workers: 6
optim:
  lr: 1.0e-4
  min_lr_ratio: 0.1
  betas: [0.9, 0.95]
  weight_decay: 0.05
  warmup_steps: 1000
  max_steps: 30000
  grad_clip: 1.0
  label_smoothing: 0.1
  light_batch_size: 32
  light_loss_weight: 1.0
  z_loss: 1.0e-4
run:
  out_dir: checkpoints/light_v2
  device: cuda
  precision: bf16
  seed: 0
  train_notes: false
  train_lights: true
  init_from: checkpoints/note_v1/best.pt
  freeze: [encoder, notes]
  log_every: 100
  eval_every: 1000
  eval_batches: 50
  save_every: 1000
  keep_checkpoints: 3
  early_save_every: 500
  early_save_until: 5000
  cuda_memory_fraction: 0.82
  guard:
    enabled: true
    grad_ratio: 10.0
    grad_steps: 100
    grad_window: 150
    loss_jump: 1.0
    max_rollbacks: 3
    lr_factor: 0.5
